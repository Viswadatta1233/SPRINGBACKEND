# Render / production profile (activate with SPRING_PROFILES_ACTIVE=prod or Dockerfile CMD)

server.port=${PORT:8080}
server.address=0.0.0.0

# Fail fast if Postgres env vars are wrong (avoid hanging deploy port scan)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Postgres (Supabase on Render MUST use the pooler host, not db.*.supabase.co:5432)
# Supabase → Project Settings → Database → Connection string → URI → "Transaction pooler"
# Example:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME=postgres.<project-ref>
#   DB_PASSWORD=<your-db-password>
# Also disable "Restrict IP" in Supabase or Render cannot connect.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.ai.chat.memory.repository.jdbc.platform=postgresql

# Less I/O during startup on small instances
logging.level.root=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.ai.chat.client.advisor=WARN
logging.level.org.springframework.ai.chat.model=WARN
logging.level.org.springframework.ai.tool=WARN
logging.level.org.springframework.ai.openai=WARN
logging.level.com.ecommerce.project=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Cross-origin frontend (e.g. localhost or Vercel) calling Render API needs SameSite=None + Secure
app.jwt.cookie.secure=true
app.jwt.cookie.same-site=None
app.jwt.cookie.path=/
