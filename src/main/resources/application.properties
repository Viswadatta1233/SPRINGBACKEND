spring.application.name=sb-ecom

spring.datasource.url=jdbc:postgresql://db.akkjwjuwlszfoysjmdbj.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

project.image=images/

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000
spring.ecom.app.jwtCookieName=springBootEcom

stripe.secret.key=${STRIPE_SECRET_KEY}

frontend.url=http://localhost:5173/
image.base.url=http://localhost:8080/images

# ===== Spring AI : OpenAI (chat + embeddings) =====
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-5.1
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=text-embedding-3-large
# text-embedding-3-large defaults to 3072 dims, but pgvector HNSW caps at 2000 — use 1536 here
# and match spring.ai.vectorstore.pgvector.dimensions below (must be identical).
spring.ai.openai.embedding.options.dimensions=1536

# ===== Spring AI : PGVector store (reuses the main Supabase datasource) =====
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536

# Persist chat conversations in Postgres (creates SPRING_AI_CHAT_MEMORY table on startup)
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

logging.level.com.ecommerce.project.service.ProductIndexServiceImpl=DEBUG

# Assistant + tool-call tracing (grep console for [ASSISTANT] and [ASSISTANT-TOOL])
logging.level.com.ecommerce.project.ai=INFO
logging.level.com.ecommerce.project.service.AiAssistantServiceImpl=INFO
logging.level.com.ecommerce.project.controller.AiAssistantController=INFO
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
logging.level.org.springframework.ai.chat.model=DEBUG
logging.level.org.springframework.ai.tool=DEBUG
logging.level.org.springframework.ai.openai=DEBUG
server.port=${PORT:8080}