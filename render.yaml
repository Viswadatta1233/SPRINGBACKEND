# Optional Blueprint for Render (Dashboard deploy works without this file).
#
# CRITICAL — Supabase from Render:
# Use Transaction pooler (port 6543), NOT direct db.xxx.supabase.co:5432 (IPv6 → "Network is unreachable").
# SPRING_DATASOURCE_URL=jdbc:postgresql://<region>.pooler.supabase.com:6543/postgres?sslmode=require
# SPRING_DATASOURCE_USERNAME=postgres.<project-ref>
# In Supabase: Database → Network → allow connections from anywhere (or Render egress IPs).
services:
  - type: web
    name: sb-ecom
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
